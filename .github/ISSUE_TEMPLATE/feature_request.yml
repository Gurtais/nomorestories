name: Feature request
description: Suggest an idea or enhancement
title: ""
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem and the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: "I want to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
      placeholder: "It would be helpful if..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other options did you consider?
      placeholder: "Alternative approaches:"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share examples, screenshots, or references.
      placeholder: "Relevant links or context"
    validations:
      required: false
